<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally · Starting soon</title>
<link rel="stylesheet" href="../assets/tally.css">
<script type="module">
	const q = new URLSearchParams(location.search);
	const chips = document.querySelector('.tally-chips');
	const list = (q.get('chips') ?? chips.dataset.default).split('|').map((s) => s.trim()).filter(Boolean);
	chips.replaceChildren(...list.map((c) => Object.assign(document.createElement('span'), { className: 'tally-chip', textContent: c })));
	if (q.get('backdrop')) document.querySelector('.tally-layout-announce').dataset.backdrop = q.get('backdrop');
</script>
<script type="module" src="../assets/tally.js"></script>
</head>
<body>
<div class="tally-stage tally-layout-announce">
	<span class="tally-layout-announce__brand tally-brand"><b data-tally-param="brand" data-tally-default="Swarnil">Swarnil</b><i class="tally-dot" data-pulse></i></span>
	<div class="tally-layout-announce__corner">
		<time class="tally-clock tally-glass" data-tally-clock>00:00</time>
	</div>
	<main class="tally-layout-announce__main">
		<section class="tally-card tally-glass">
			<span class="tally-card__eyebrow"><i class="tally-dot"></i><span data-tally-param="eyebrow" data-tally-default="Starting soon">Starting soon</span></span>
			<h1 class="tally-card__title" data-tally-param="title" data-tally-default="Building a Salesforce app live">Building a Salesforce app live</h1>
			<p class="tally-card__body" data-tally-param="body" data-tally-default="Grab a coffee. We begin at the top of the hour." data-tally-optional>Grab a coffee. We begin at the top of the hour.</p>
			<div class="tally-card__foot">
				<div class="tally-chips" data-default="@imswarnil | youtube.com/@imswarnil | imswarnil.com"></div>
				<time class="tally-count" data-tally-count="15m"><span data-part="hh" hidden>00</span><span class="tally-count__sep" data-part-sep="hh" hidden>:</span><span data-part="mm">15</span><span class="tally-count__sep">:</span><span data-part="ss">00</span></time>
			</div>
		</section>
	</main>
	<div class="tally-layout-announce__foot">
		<canvas class="tally-viz" data-tally-viz="bars" aria-hidden="true"></canvas>
	</div>
</div>
</body>
</html>
