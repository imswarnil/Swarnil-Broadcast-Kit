<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally · Lower third</title>
<link rel="stylesheet" href="../assets/tally.css">
<script type="module" src="../assets/tally.js"></script>
</head>
<body>
<div class="tally-stage">
	<div class="tally-pin" data-at="bottom-left" data-tally-at="at">
		<div class="tally-lower-third tally-glass" data-tally-visible="true" data-tally-variant="variant" data-tally-base="tally-lower-third">
			<span class="tally-lower-third__bar"></span>
			<div class="tally-lower-third__text">
				<strong class="tally-lower-third__name" data-tally-param="name" data-tally-default="Swarnil Singhai">Swarnil Singhai</strong>
				<span class="tally-lower-third__title" data-tally-param="title" data-tally-default="Salesforce Architect · imswarnil.com" data-tally-optional>Salesforce Architect · imswarnil.com</span>
			</div>
		</div>
	</div>
</div>
</body>
</html>
