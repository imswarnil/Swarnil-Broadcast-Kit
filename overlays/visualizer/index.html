<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally · Visualizer</title>
<link rel="stylesheet" href="../assets/tally.css">
<script type="module">
	// Modifier toggles come from the URL; the runtime paints from the classes.
	const q = new URLSearchParams(location.search);
	const c = document.querySelector('.tally-viz');
	for (const k of ['mirror', 'cap', 'mono']) if (q.get(k) && q.get(k) !== '0') c.classList.add(`tally-viz--${k}`);
</script>
<script type="module" src="../assets/tally.js"></script>
</head>
<body>
<div class="tally-stage">
	<canvas class="tally-viz" data-tally-viz="bars" aria-hidden="true"></canvas>
	<span class="tally-sr">Audio visualizer</span>
</div>
</body>
</html>
