name: Release

# Tag `vX.Y.Z` and push it: the pack is built and attached to a GitHub
# release, so people who want the overlays offline have one zip to download.
#   npm version minor && git push --follow-tags

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { SITE_URL: 'https://obs.imswarnil.com/' }
      - run: npm run check
      - run: npm run pack
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/pack/*.zip
          generate_release_notes: true
