name: Deploy to obs.imswarnil.com

# Every push to main builds, checks and ships dist/ to the Cloudflare Worker
# that serves obs.imswarnil.com. Two repository secrets are needed:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template + Zone:DNS:Read on imswarnil.com
#   CLOUDFLARE_ACCOUNT_ID
# Until they exist the deploy job is skipped, and the run stays green.

on:
  push: { branches: [main] }
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.gate.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { SITE_URL: 'https://obs.imswarnil.com/' }
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 3 }
      - id: gate
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}', A: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — build verified, deploy skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: build
    if: needs.build.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://obs.imswarnil.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
